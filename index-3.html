<style>
:root{--bg:#F3F5F9;--card:#fff;--ink:#101828;--mute:#667085;--line:#E4E7EC;--brand:#2447F5;--heart:#D92D56;--on:#16A34A;--chip:#E9EDF7}
[data-theme=dark]{--bg:#0B0F1A;--card:#141A28;--ink:#EDF0F7;--mute:#98A2B3;--line:#242C3D;--brand:#5B7BFF;--heart:#FF5C7F;--chip:#1C2336}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;outline:none;resize:none}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
[hidden]{display:none!important}
#app{max-width:640px;margin:0 auto;min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.logo{font-weight:700;font-style:italic;font-size:24px;letter-spacing:.02em}.logo b{color:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--bg)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{flex:1;height:56px;display:grid;place-items:center;color:var(--mute);position:relative}
.nav .on{color:var(--brand)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;position:relative}
.bd{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--heart);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bd:empty{display:none}.bd.st{position:static}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 12px;padding:12px}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:space-between;margin-top:8px}
.grow{flex:1;min-width:0}.clip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted,time,small{color:var(--mute);font-size:13px}
.av{width:var(--s);height:var(--s);border-radius:50%;object-fit:cover;flex:none;display:inline-block;background:var(--chip)}
.av.ph{display:inline-grid;place-items:center;font-weight:700;color:var(--brand);font-size:calc(var(--s)*.42)}
.avw{position:relative;display:inline-block;flex:none}
.dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.dot.on{background:var(--on)}
.btn{background:var(--brand);color:#fff;border-radius:999px;padding:11px 18px;font-weight:600;width:100%}
.btn.sm{width:auto;padding:6px 16px;font-size:14px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--heart);border:1px solid var(--heart)}
.btn:disabled{opacity:.6}
.link{color:var(--brand);font-weight:600;padding:8px}
.chip-btn{background:var(--chip);padding:6px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.post{padding:14px 16px;border-bottom:1px solid var(--line)}
.who{display:flex;gap:10px;align-items:center;text-align:left;flex:1;min-width:0}
.who b{display:block;line-height:1.2}
.body{white-space:pre-wrap;word-break:break-word;margin:8px 0}
.pimg{width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin:8px 0;background:var(--chip);display:block}
.acts{gap:6px;flex-wrap:wrap;margin-top:6px}
.rx{display:inline-flex;gap:4px;align-items:center;padding:4px 11px;border-radius:999px;background:var(--chip);font-size:15px;min-height:34px}
.rx span{font-size:13px;font-weight:600}
.rx.on{background:var(--brand);color:#fff}
.tabs{display:flex;margin:4px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px;color:var(--mute);font-weight:600;border-bottom:3px solid transparent}
.tabs .on{color:var(--ink);border-color:var(--brand)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px}.bar h2{font-size:18px}
.item{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item.unread{background:var(--chip)}
.empty{text-align:center;color:var(--mute);padding:36px 24px}.load{text-align:center;color:var(--mute);padding:24px}
.cbar{position:sticky;bottom:calc(56px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line)}
.rhead{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
#msgs{padding:12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--chip);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff}
.bub time{display:block;font-size:11px;color:inherit;opacity:.7}
.auth{padding:56px 24px;display:flex;flex-direction:column;gap:12px}
.auth .logo{font-size:40px}.auth form{display:flex;flex-direction:column;gap:10px}
.prof{padding:16px}.prof h2{font-size:20px;line-height:1.2}
.stats{display:flex;gap:24px;margin:12px 0}.stats>*{text-align:left}.stats b{display:block;font-size:18px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px}
.seg .on{background:var(--brand);border-color:var(--brand);color:#fff}
.pv{max-height:220px;border-radius:12px;margin-top:8px;width:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;text-align:center}
.vb{width:17px;height:17px;vertical-align:-3px;margin-left:4px;stroke:none;display:inline-block;flex:none}
.stories{display:flex;gap:12px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex:none;cursor:pointer}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--brand)}
.ring.add{border:2px dashed var(--mute);color:var(--brand);font-size:26px;font-weight:700}
.st small{max-width:64px;text-align:center}
select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font:inherit;color:inherit;max-width:55%}
#sv{position:fixed;inset:0;background:#000;z-index:30;display:flex;justify-content:center}
.svb{position:relative;width:100%;max-width:480px;display:flex;flex-direction:column;color:#fff}
.svh{position:relative;z-index:2;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.svh time{color:#ddd}.svh button{color:#fff;font-size:18px;padding:6px}
.svb img.si{flex:1;min-height:0;width:100%;object-fit:contain}
.svc{position:relative;z-index:2;padding:12px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;min-height:56px}
.svn{position:absolute;inset:0;z-index:1}
.edit{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.edit .row{justify-content:flex-end}
.acts .sp{flex:1}
.vm{display:flex;align-items:center;gap:8px;min-width:160px;color:inherit}
.vm .ps{display:none}.vm.on .ps{display:inline}.vm.on .pl{display:none}
.wv{flex:1;height:14px;opacity:.55;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 5px)}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--heart);animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.cbar .ic{flex:none;font-size:20px}
.sn{display:block;font-weight:600;font-size:12px;color:var(--brand)}.bub.me .sn{color:#fff}
.gm{width:auto}
.form label.pick{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:16px;padding:4px 0}
.tag{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px;font-weight:500}
#se{position:fixed;inset:0;background:#000;z-index:40;display:flex;justify-content:center}
.seb{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;color:#fff}
.seh{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.seh>button:first-child{color:#fff;font-size:20px;padding:6px 10px}
.sest{flex:1;min-height:0;display:grid;place-items:center;padding:4px 8px}
.stage{position:relative;display:inline-block;max-width:100%;line-height:0;overflow:hidden;border-radius:10px}
.stage img{display:block;max-width:100%;max-height:calc(100dvh - 270px)}
#seitems{position:absolute;inset:0;overflow:hidden}
.sei{position:absolute;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;line-height:1;white-space:nowrap}
.sei.txt{background:rgba(0,0,0,.55);color:#fff;padding:.3em .6em;border-radius:.5em;font-weight:700;line-height:1.25;text-align:center;white-space:normal;width:max-content;max-width:85%;overflow-wrap:anywhere}
.sei.on{outline:2px dashed #fff;outline-offset:4px}
.setools{padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.setools input{background:#1c1c1e;border-color:#3a3a3c;color:#fff;margin-bottom:6px}
.selbar{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.selbar button{width:46px;height:36px;border-radius:12px;background:#333;color:#fff;font-size:20px}
.emojis{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.emojis button{font-size:28px;flex:none;padding:2px 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const errMsg = e=>{const m=e?.message||'';
  if(/already registered/i.test(m))return L('An account with this email already exists');
  if(/too_many_attempts/.test(m))return L('Too many wrong attempts. Try again in 10 minutes');
  if(/duplicate key/i.test(m))return L('This name is already taken');
  if(/exceed|too large|payload/i.test(m))return L('File is too large (max 50 MB)');
  return m||L('Something went wrong');};
const ok = r=>{ if(r.error) throw r.error; return r; };
function ago(t0){const s=(Date.now()-new Date(t0))/1000;
  if(s<60)return L('just now'); if(s<3600)return L('{n} min ago',{n:bn(Math.floor(s/60))});
  if(s<86400)return L('{n} h ago',{n:bn(Math.floor(s/3600))}); if(s<604800)return L('{n} d ago',{n:bn(Math.floor(s/86400))});
  return new Date(t0).toLocaleDateString(LOC());}

async function shrink(file,max){
  const bmp=await createImageBitmap(file); const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}
async function upload(bucket,file){
  const vid=file.type.startsWith('video/');
  if(vid&&file.size>50*1024*1024)throw new Error(L('Video can be 50 MB at most'));
  const body=vid?file:await shrink(file,bucket==='avatars'?512:1280);
  const ext=vid?((file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4'):'jpg';
  const path=`${me.id}/${Date.now()}.${ext}`;
  ok(await sb.storage.from(bucket).upload(path,body,{contentType:vid?file.type:'image/jpeg'}));
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

/* ================== AUTH ================== */
function authScreen(mode='login'){
  const su=mode==='signup';
  app.innerHTML=`<div class="auth"><div class="logo">FIT<b>GRAM</b></div>
  <p class="muted">${L('Workouts, friends and daily progress in one place.')}</p>
  <form id="af">
    ${su?`<input name="full_name" placeholder="${L('Full name')}" required maxlength="50">
    <input name="username" placeholder="${L('Username (a-z, 0-9, _)')}" required pattern="[a-zA-Z0-9_]{3,20}" autocapitalize="none">`:''}
    <input name="email" type="email" placeholder="${L('Email')}" required autocapitalize="none">
    <input name="password" type="password" placeholder="${L('Password (min 6 characters)')}" minlength="6" required>
    <button class="btn" type="submit">${su?L('Create account'):L('Log in')}</button>
  </form>
  ${su?'':`<button class="link" id="fp">${L('Forgot password?')}</button>`}
  <button class="link" id="lg">${lang==='en'?'বাংলা':'English'}</button>
  <button class="link" id="sw">${su?L('Already have an account? Log in'):L('New here? Create an account')}</button></div>`;
  $('#sw').onclick=()=>authScreen(su?'login':'signup');
  $('#lg').onclick=()=>{lang=lang==='en'?'bn':'en';saveLang();authScreen(mode);};
  if($('#fp'))$('#fp').onclick=async()=>{
    const em=(prompt(L('Enter your email'))||'').trim(); if(!em)return;
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    toast(error?errMsg(error):L('Password reset link sent to your email'));
  };
  $('#af').onsubmit=async e=>{
    e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); const b=$('#af button'); b.disabled=true;
    try{
      if(su){
        const u=f.username.toLowerCase();
        const {data:ex}=await sb.from('profiles').select('id').eq('username',u).maybeSingle();
        if(ex) throw new Error(L('This username is already taken'));
        const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{username:u,full_name:f.full_name.trim()}}});
        if(error) throw error;
        if(!data.session){toast(L('Click the link sent to your email to activate your account'));}
      } else {
        const {error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});
        if(error) throw new Error(L('Incorrect email or password'));
      }
    }catch(err){toast(errMsg(err))}
    b.disabled=false;
  };
}

async function boot(user){
  me=user; stack=[]; view={name:'home'};
  const {data}=await sb.from('profiles').select('*').eq('id',me.id).single(); myProfile=data;
  const f=await sb.from('follows').select('following_id').eq('follower_id',me.id);
  myFollowing=new Set((f.data||[]).map(x=>x.following_id));
  const [bl,mp,pf]=await Promise.all([
    sb.from('blocks').select('blocked_id').eq('blocker_id',me.id),
    sb.from('pages').select('id,name,handle,avatar_url').eq('owner_id',me.id),
    sb.from('page_follows').select('page_id').eq('user_id',me.id)]);
  myBlocked=new Set((bl.data||[]).map(x=>x.blocked_id)); myPages=mp.data||[]; myPageFollowing=new Set((pf.data||[]).map(x=>x.page_id));
  shell();
  startRealtime(); refreshBadges(); render();
}
function setLang(l){lang=l;saveLang();if(me){shell();refreshBadges();render();}else authScreen();}
function cleanup(){closeStory();myBlocked=new Set();myPages=[];myPageFollowing=new Set();me=null;myProfile=null;stack=[];online=new Set();posts.clear();sb.removeAllChannels();if(io)io.disconnect();}

function startRealtime(){
  sb.channel('db-'+me.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`receiver_id=eq.${me.id}`},({new:x})=>{
      if(view.name==='room'&&view.id===x.sender_id){addBubble(x);markRead(x.sender_id);}
      else{toast(L('New message received')); if(view.name==='chats')render();}
      refreshBadges();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'group_id=gt.0'},async({new:x})=>{
      if(x.sender_id===me.id)return;
      if(view.name==='group'&&view.id===x.group_id){
        if(!gProfiles[x.sender_id]){const r=await sb.from('profiles').select(PSEL).eq('id',x.sender_id).single(); if(r.data)gProfiles[x.sender_id]=r.data;}
        addBubble(x); sb.rpc('mark_group_read',{gid:x.group_id}).then(()=>refreshBadges());
      }else{toast(L('New group message')); if(view.name==='chats')render();}
      refreshBadges();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${me.id}`},()=>{refreshBadges(); if(view.name==='notifs')render();})
    .subscribe();
  const pc=sb.channel('presence:fitgram',{config:{presence:{key:me.id}}});
  pc.on('presence',{event:'sync'},()=>{online=new Set(Object.keys(pc.presenceState())); paintOnline();})
    .subscribe(async s=>{if(s==='SUBSCRIBED')await pc.track({at:Date.now()});});
}
function paintOnline(){
  document.querySelectorAll('[data-dot]').forEach(d=>d.classList.toggle('on',online.has(d.dataset.dot)));
  document.querySelectorAll('[data-st]').forEach(d=>d.textContent=online.has(d.dataset.st)?L('Online'):L('Offline'));
}
const setBd=(s,n)=>{const e=$(s);if(e)e.textContent=n?bn(n>99?99:n):''};
async function refreshBadges(){
  const [a,b,c]=await Promise.all([
    sb.from('notifications').select('*',{count:'exact',head:true}).eq('is_read',false),
    sb.from('messages').select('*',{count:'exact',head:true}).eq('receiver_id',me.id).is('read_at',null),
    sb.rpc('my_group_unread')]);
  const gu=(c.data||[]).reduce((n,x)=>n+Number(x.n),0);
  setBd('#bn',a.count); setBd('#bm',(b.count||0)+gu);

const restoreBar=()=>{const b=$('#cb');if(b)b.innerHTML=barInner();};

/* ---- voice recording & playback ---- */
const MIMES=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
async function startRec(){
  if(rec)return;
  if(!navigator.mediaDevices||!window.MediaRecorder)throw new Error(L('Voice recording is not supported on this browser'));
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=MIMES.find(x=>MediaRecorder.isTypeSupported(x))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  const r={mr,stream,chunks:[],start:Date.now(),mime:mr.mimeType||mime||'audio/webm',timer:null};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data);};
  mr.start(250); rec=r;
  $('#cb').innerHTML=recBar();
  r.timer=setInterval(()=>{const n=Math.floor((Date.now()-r.start)/1000);const el=$('#rt');if(el)el.textContent=fmt(n);
    if(n>=120)A.recsend().catch(x=>toast(errMsg(x)));},250);
}
function abortRec(){
  if(!rec)return; const r=rec; rec=null; clearInterval(r.timer);
  try{r.mr.stop();}catch(e){} r.stream.getTracks().forEach(x=>x.stop());
}
async function finishRec(){
  const r=rec; if(!r)return; rec=null; clearInterval(r.timer);
  const blob=await new Promise(res=>{r.mr.onstop=()=>res(new Blob(r.chunks,{type:r.mime}));try{r.mr.stop();}catch(e){res(new Blob(r.chunks,{type:r.mime}));}});
  r.stream.getTracks().forEach(x=>x.stop()); restoreBar();
  const secs=Math.round((Date.now()-r.start)/1000);
  if(secs<1||blob.size<800)return toast(L('Recording is too short'));
  const ext=r.mime.includes('mp4')?'m4a':r.mime.includes('ogg')?'ogg':'webm';
  const path=`${me.id}/${Date.now()}.${ext}`;
  ok(await sb.storage.from('voice').upload(path,blob,{contentType:r.mime.split(';')[0]}));
  const base={sender_id:me.id,body:'',audio_path:path,audio_secs:Math.min(secs,300)};
  const row=view.name==='group'?{...base,group_id:view.id}:{...base,receiver_id:view.id};
  addBubble(ok(await sb.from('messages').insert(row).select().single()).data);
}
async function playVoice(t){
  const key=t.dataset.id;
  if(audioEl&&audioKey===key){ if(audioEl.paused){audioEl.play();t.classList.add('on');}else{audioEl.pause();t.classList.remove('on');} return; }
  if(audioEl){audioEl.pause();document.querySelectorAll('.vm.on').forEach(b=>b.classList.remove('on'));}
  const {data,error}=await sb.storage.from('voice').createSignedUrl(t.dataset.p,3600); if(error)throw error;
  const a=new Audio(data.signedUrl); audioEl=a; audioKey=key; t.classList.add('on');
  a.onended=()=>{t.classList.remove('on');if(audioEl===a){audioEl=null;audioKey=null;}};
  await a.play();
}

  const ms=ok(dm).data, groups=(ok(gmr).data||[]).map(x=>x.chat_groups).filter(Boolean);

  ms.forEach(x=>{const o=x.sender_id===me.id?x.receiver_id:x.sender_id; if(!map.has(o))map.set(o,{last:x,unread:0}); if(x.receiver_id===me.id&&!x.read_at)map.get(o).unread++;});

  const gids=groups.map(g=>g.id);

  const lastG=new Map(); gl.forEach(x=>{if(!lastG.has(x.group_id))lastG.set(x.group_id,x);});
  const pv=x=>(x.sender_id===me.id?L('You: '):'')+(x.audio_path?'🎙️ '+L('Voice message'):esc(x.body));
  const rows=[];
  ids.forEach(id=>{

    rows.push({t:new Date(c.last.created_at).getTime(),h:`<button class="item ${c.unread?'unread':''}" data-a="chat" data-id="${id}">${avo(p,48)}

      ${c.unread?`<span class="bd st">${bn(c.unread)}</span>`:''}</button>`});
  });
  groups.forEach(g=>{
    const last=lastG.get(g.id), u=gUnread.get(g.id)||0;
    rows.push({t:last?new Date(last.created_at).getTime():0,h:`<button class="item ${u?'unread':''}" data-a="group" data-id="${g.id}">${av({full_name:g.name},48)}
      <span class="grow"><b>${esc(g.name)}</b><small class="clip">${last?pv(last):L('No messages yet.')}</small></span>
      ${u?`<span class="bd st">${bn(u)}</span>`:''}</button>`});
  });
  rows.sort((a,b)=>b.t-a.t);
  m.innerHTML=`<div class="bar"><h2 class="grow">${L('Messages')}</h2><button class="btn ghost sm" data-a="newgroup">＋ ${L('New group')}</button></div>`
    +(rows.length?rows.map(r=>r.h).join(''):`<div class="empty">${L('No messages yet.')}<br>${L('Search for someone and start a chat from their profile.')}</div>`);
}

  seemoji(t){se.items.push({type:'emoji',ch:t.dataset.e,x:.5,y:.45,size:.16});se.sel=se.items.length-1;seRender();},
  seplus(){const o=se.items[se.sel];if(o){o.size=Math.min(.7,o.size*1.2);seRender();}},
  seminus(){const o=se.items[se.sel];if(o){o.size=Math.max(.03,o.size/1.2);seRender();}},
  sedel(){
    const o=se.items[se.sel]; if(!o)return;
    if(o.type==='text'){const ti=$('#setext');if(ti)ti.value='';}
    se.items.splice(se.sel,1);se.sel=null;seRender();
  },
  async seshare(t){
    if(!se||se.busy)return; se.busy=true; t.disabled=true;
    try{
      const blob=await seExport(), path=`${me.id}/${Date.now()}.jpg`;
      ok(await sb.storage.from('posts').upload(path,blob,{contentType:'image/jpeg'}));
      const image_url=sb.storage.from('posts').getPublicUrl(path).data.publicUrl;
      ok(await sb.from('stories').insert({user_id:me.id,image_url,caption:''}));
      closeStoryEditor(); toast(L('Story posted')); loadStories();
    }finally{if(se)se.busy=false;t.disabled=false;}
  },
  async saveprofile(t){
    t.disabled=true;
    try{
      let avatar_url=myProfile.avatar_url; const f=$('#sf').files[0]; if(f)avatar_url=await upload('avatars',f);
      myProfile=ok(await sb.from('profiles').update({full_name:$('#sn').value.trim(),bio:$('#sbio').value.trim(),avatar_url}).eq('id',me.id).select().single()).data;
      toast(L('Saved')); render();
    }finally{t.disabled=false;}
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t||!A[t.dataset.a])return;
  (async()=>A[t.dataset.a](t,e))().catch(err=>{console.error(err);toast(errMsg(err));});
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pf'){const f=t.files[0],pv=$('#pv'),tx=$('#pvt');pv.hidden=true;tx.hidden=true;
    if(f&&f.type.startsWith('image/')){pv.src=URL.createObjectURL(f);pv.hidden=false;}
    else if(f){tx.textContent=L('Video selected: ')+f.name;tx.hidden=false;}}
  if(t.id==='stf'&&t.files[0]){openStoryEditor(t.files[0]);t.value='';}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='vc'){e.preventDefault();const b=$('[data-a=verify]');if(b)A.verify(b).catch(x=>toast(errMsg(x)));return;}
  if(e.key!=='Enter'||e.shiftKey)return;
  if(e.target.id==='mi'){e.preventDefault();A.send().catch(x=>toast(x.message));}
  if(e.target.id==='ci'){e.preventDefault();const b=$('[data-a=comment]');if(b)A.comment(b).catch(x=>toast(x.message));}
});

/* ================== STORY EDITOR ================== */
const EMOJIS=['😀','😂','😍','🔥','💪','🏋️','🏃','🥇','🏆','❤️','👏','🙌','😎','🥳','💯','✨','⚡','🍎','💧','🧘','🚴','⚽','🎯','🌟','😅','🤩','🙏','👍'];
function openStoryEditor(file){
  closeStoryEditor();
  se={url:URL.createObjectURL(file),items:[],sel:null,drag:null,busy:false};
  const el=document.createElement('div'); el.id='se';
  el.innerHTML=`<div class="seb"><div class="seh"><button data-a="seclose" aria-label="${L('Close')}">✕</button><b>${L('New story')}</b><button class="btn sm" data-a="seshare">${L('Share story')}</button></div>
    <div class="sest"><div id="stage" class="stage"><img id="seimg" src="${se.url}" alt=""><div id="seitems"></div></div></div>
    <div class="setools"><div id="sesel" class="selbar" hidden><button data-a="seminus" aria-label="${L('Smaller')}">−</button><button data-a="seplus" aria-label="${L('Bigger')}">＋</button><button data-a="sedel" aria-label="${L('Delete')}">🗑️</button></div>
    <input id="setext" maxlength="80" placeholder="${L('Add a caption…')}" autocomplete="off">
    <div class="emojis">${EMOJIS.map(e=>`<button data-a="seemoji" data-e="${e}">${e}</button>`).join('')}</div></div></div>`;
  document.body.appendChild(el);
  $('#seimg').onload=seRender;
}
function closeStoryEditor(){$('#se')?.remove();if(se&&se.url)URL.revokeObjectURL(se.url);se=null;}
function seRender(){
  const st=$('#stage'), box=$('#seitems'); if(!se||!st||!box)return; const W=st.clientWidth;
  box.innerHTML=se.items.map((it,i)=>`<div class="sei ${it.type==='text'?'txt':''} ${se.sel===i?'on':''}" data-i="${i}" style="left:${it.x*100}%;top:${it.y*100}%;font-size:${Math.round(it.size*W)}px">${esc(it.type==='text'?it.text:it.ch)}</div>`).join('');
  const sb2=$('#sesel'); if(sb2)sb2.hidden=se.sel==null;
}
function seSelect(i){se.sel=i;document.querySelectorAll('.sei').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));const sb2=$('#sesel');if(sb2)sb2.hidden=i==null;}
document.addEventListener('pointerdown',e=>{
  if(!se)return; const it=e.target.closest?e.target.closest('.sei'):null;
  if(!it){if(e.target.closest&&e.target.closest('#stage'))seSelect(null);return;}
  e.preventDefault(); const i=+it.dataset.i; se.drag=i; seSelect(i);
});
document.addEventListener('pointermove',e=>{
  if(!se||se.drag==null)return; const st=$('#stage'); if(!st)return; const r=st.getBoundingClientRect();
  const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  const o=se.items[se.drag]; if(!o)return; o.x=x;o.y=y;
  const el=$(`.sei[data-i="${se.drag}"]`); if(el){el.style.left=(x*100)+'%';el.style.top=(y*100)+'%';}
});
const seEndDrag=()=>{if(se)se.drag=null;};
document.addEventListener('pointerup',seEndDrag); document.addEventListener('pointercancel',seEndDrag);
window.addEventListener('resize',()=>{if(se)seRender();});
document.addEventListener('input',e=>{
  if(e.target.id!=='setext'||!se)return;
  const v=e.target.value, i=se.items.findIndex(x=>x.type==='text');
  if(!v.trim()){if(i>=0){se.items.splice(i,1);se.sel=null;}}
  else if(i>=0)se.items[i].text=v;
  else{se.items.push({type:'text',text:v,x:.5,y:.82,size:.06});}
  seRender();
});
function wrapText(g,text,maxW){
  const words=text.split(/\s+/).filter(Boolean), lines=[]; let cur='';
  for(const w of words){const tl=cur?cur+' '+w:w; if(!cur||g.measureText(tl).width<=maxW)cur=tl; else{lines.push(cur);cur=w;}}
  if(cur)lines.push(cur); return lines;
}
function seExport(){
  const img=$('#seimg'), nw=img.naturalWidth, nh=img.naturalHeight, k=Math.min(1,1280/Math.max(nw,nh));
  const W=Math.round(nw*k), H=Math.round(nh*k), c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); g.drawImage(img,0,0,W,H);
  for(const it of se.items){
    const px=it.size*W, cx=it.x*W, cy=it.y*H;
    if(it.type==='emoji'){
      g.font=`${px}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif`;
      g.textAlign='center'; g.textBaseline='middle'; g.fillText(it.ch,cx,cy);
    }else{
      g.font=`700 ${px}px "Hind Siliguri",system-ui,sans-serif`; g.textAlign='center'; g.textBaseline='middle';
      const padX=px*.6, padY=px*.3, lh=px*1.25, lines=wrapText(g,it.text,W*.85-2*padX);
      const bw=Math.min(W*.85,Math.max(...lines.map(l=>g.measureText(l).width))+2*padX), bh=lines.length*lh+2*padY, r=px*.5;
      const x0=cx-bw/2, y0=cy-bh/2;
      g.fillStyle='rgba(0,0,0,.55)'; g.beginPath();
      g.moveTo(x0+r,y0); g.arcTo(x0+bw,y0,x0+bw,y0+bh,r); g.arcTo(x0+bw,y0+bh,x0,y0+bh,r); g.arcTo(x0,y0+bh,x0,y0,r); g.arcTo(x0,y0,x0+bw,y0,r); g.closePath(); g.fill();
      g.fillStyle='#fff'; lines.forEach((l,n)=>g.fillText(l,cx,y0+padY+lh*(n+.5)));
    }
  }
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('export failed')),'image/jpeg',.9));
}

(async()=>{
  if(cfg.url.startsWith('PASTE')){app.innerHTML='<div class="empty">Paste your Supabase URL and anon key at the top of index.html.</div>';return;}
  const {data:{session}}=await sb.auth.getSession();
  session?boot(session.user):authScreen();
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='SIGNED_IN'&&s&&(!me||me.id!==s.user.id))boot(s.user);
    if(ev==='SIGNED_OUT'){cleanup();authScreen();}
    if(ev==='PASSWORD_RECOVERY')setTimeout(async()=>{
      const pw=prompt(L('Enter a new password (min 6 characters)'));
      if(pw&&pw.length>=6){const {error}=await sb.auth.updateUser({password:pw});toast(error?errMsg(error):L('Password changed'));}
    },600);
  });
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
